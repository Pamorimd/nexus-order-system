name: CI - Qualidade e Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependências de Desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Executar Linter (Ruff Check)
        run: |
          ruff check .

      - name: Verificar Formatação (Ruff Format)
        run: |
          ruff format . --check

      - name: Executar Testes Automatizados (Pytest)
        run: |
          pytest
