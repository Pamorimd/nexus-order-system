[project]
name = "nexus-order-system"
version = "1.0.0"
description = "Motor resiliente de processamento de pedidos, tarifação e liquidação financeira multigateway."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Priscila Amorim dos Santos", email = "priscilaa.amorin@outlook.com" },
    { name = "Enrico Colella", email = "colellaenrico0@gmail.com" },
    { name = "Jhonatan Decreci", email = "jhonatandecrecims@gmail.com" },
    { name = "Bransani", email = "bransani88@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"] # Linhas longas em comentários/docstrings tratados com bom senso

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
